services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbivision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-orbivision-production-jwt-key-replace-with-env}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1:5173,https://orbivision.com
      - DATABASE_PATH=/app/data/orbivision.db
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@orbivision.com}
      - FOUNDER_EMAILS=826458om@gmail.com,trushalmparmar96@gmail.com
    volumes:
      - backend-data:/app/data
    networks:
      - orbivision-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbivision-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - orbivision-network

volumes:
  backend-data:
    driver: local

networks:
  orbivision-network:
    driver: bridge
